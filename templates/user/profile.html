{% extends 'user/user_home2.html' %}

{% block body %}
<div class="container d-flex justify-content-center mt-5">
    <div class="card p-4" style="max-width: 450px; border: none; border-radius: 12px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);">
        <!-- Profile Image Section -->
        <div class="text-center mb-4">
            <div class="position-relative">
                <img src="{{ user.photo }}" alt="{{ user.name }}"
                     class="rounded-circle"
                     style="width: 130px; height: 130px; border: 6px solid #fff; box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.15);">
            </div>
            <h3 class="mt-3 mb-1 font-weight-bold text-dark">{{ user.name }}</h3>
            <p class="text-muted">{{ user.place }}</p>
        </div>

        <!-- User Details -->
        <div class="text-center mb-4" style="color: #666;">
            <p><i class="fas fa-envelope mr-2" style="color: #4A90E2;"></i><strong>Email:</strong> {{ user.email }}</p>
            <p><i class="fas fa-phone mr-2" style="color: #4A90E2;"></i><strong>Phone:</strong> {{ user.phone }}</p>
            <p><i class="fas fa-images mr-2" style="color: #4A90E2;"></i><strong>Posts:</strong> {{ user.posts }}</p>
        </div>

        <!-- Update Profile Button -->
        <div class="text-center">
            <a href="/view_user_profile_POST" class="btn btn-primary btn-block"
               style="border-radius: 8px; background-color: #4A90E2; border: none; padding: 10px 20px; font-size: 16px; font-weight: bold;">
                Update Profile
            </a>
             <a href="/chg_password" class="btn btn-primary btn-block"
               style="border-radius: 8px; background-color: #4A90E2; border: none; padding: 10px 20px; font-size: 16px; font-weight: bold;">
                 Change password
            </a>
        </div>
    </div>
</div>
{% endblock %}
