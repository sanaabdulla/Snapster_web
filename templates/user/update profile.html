{% extends 'user/user_home2.html' %}

{% block body %}
<div class="container mt-5">
    <h2 class="text-center mb-4">Update Profile</h2>
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-light">
                <div class="card-body">
                    <form action="/user_update_profilefile" method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="form-group text-center">
                            <label for="photo">
                                <img src="{{ user.photo }}" alt="{{ user.name }}" class="img-fluid rounded-circle mb-3" style="width: 150px; height: 150px;">
                            </label>
                            <input type="file" id="photo" name="photo" class="form-control-file mb-3">
                        </div>
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" class="form-control" value="{{ user.name }}" required>
                        </div>
                        <div class="form-group">
                            <label for="post">Post</label>
                            <input type="text" id="post" name="post" class="form-control" value="{{ user.posts }}" required>
                        </div>
                        <div class="form-group">
                            <label for="place">Place</label>
                            <input type="text" id="place" name="place" class="form-control" value="{{ user.place }}" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" class="form-control" value="{{ user.email }}" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone</label>
                            <input type="text" id="phone" name="phone" class="form-control" value="{{ user.phone }}" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block mt-4">Update Profile</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    body {
        background-color: #f8f9fa;
    }

    .card {
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .btn-primary {
        background-color: #007bff;
        border-color: #007bff;
    }

    .btn-primary:hover {
        background-color: #0056b3;
        border-color: #004085;
    }

    .form-control {
        border-radius: 5px;
    }

    .form-control-file {
        border-radius: 5px;
    }
</style>

{% endblock %}
