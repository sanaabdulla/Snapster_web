{% extends 'user/user_home2.html' %}
{% block body %}
{#<!DOCTYPE html>#}
{#< lang="en">#}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f4f4f4;
        }

        .post-card {
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .post-card:hover {
            transform: scale(1.02);
        }

        .post-card img {
            border-radius: 8px 8px 0 0;
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .card-body {
            padding: 1rem;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            margin-top: 1rem;
        }

        .send-friend-request {
            width: 100%;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            padding: 10px;
            font-weight: bold;
            transition: background-color 0.3s;
            text-align: center;
            text-decoration: none;
        }

        .send-friend-request:hover {
            background-color: #0056b3;
            color: white;
        }

        /* Search bar styling */
        .search-bar {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .search-bar input[type="text"] {
            width: 60%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px 0 0 5px;
            outline: none;
        }

        .search-bar button {
            padding: 10px 20px;
            border: none;
            border-radius: 0 5px 5px 0;
            background-color: #007bff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .search-bar button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <form class="container mt-5" action="/view_frieds_search" method="post">
        <!-- Search bar section -->

        <div class="search-bar mb-4">
            <input type="text" id="name" name="name" placeholder="Search friends..."/>
            <button type="submit" value="search">search</button>
        </div>

        
        <div class="row">
            {% for i in data %}
                {% if i.f %}
            <div class="col-md-3 mb-4">
                <div class="card post-card">
                    <img src="{{ i.FROM.photo }}" alt="Post Image" class="card-img-top">
                    <div class="card-body">
                        <p class="card-title">{{ i.FROM.name }}</p>
                        <p><a href="/user_chat_to_user1/{{ i.FROM.LOGIN.id }}" class="btn btn-success">Chat</a></p>
                                            <p><a href="/user_unfollow/{{ i.id }}" class="btn btn-info">Unfollow</a></p>

                    </div>
                </div>
            </div>
                {% else %}
                    <div class="col-md-3 mb-4">
                <div class="card post-card">
                    <img src="{{ i.TO.photo }}" alt="Post Image" class="card-img-top">
                    <div class="card-body">
                        <p class="card-title">{{ i.TO.name }}</p>
                        <p><a href="/user_chat_to_user1/{{ i.TO.LOGIN.id }}" class="btn btn-success">Chat</a></p>
                                            <p><a href="/user_unfollow/{{ i.id }}" class="btn btn-info">Unfollow</a></p>

                    </div>
                </div>
            </div>
                {% endif %}
            {% empty %}
                <div class="col-12 text-center">
                    <p class="lead">No Friends available.</p>
                </div>
            {% endfor %}
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        function searchFriends() {
            let searchQuery = document.getElementById('search').value.toLowerCase();
            // Add search logic here to filter friends
            // For example, make a request to the server to get filtered data based on searchQuery
            console.log("Searching for:", searchQuery);
        }
    </script>
    </form>
</body>

</html>
{% endblock %}
